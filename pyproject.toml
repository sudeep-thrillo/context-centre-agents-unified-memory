[project]
name = "context-centre-agents-unified-memory"
version = "0.2.0"
description = "MCP tools for lead data retrieval from Firestore."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.3.1",
    "mcp>=1.27.1",
    "google-cloud-firestore>=2.16.0",
    "uvicorn>=0.22.0",
    "anyio>=4.0.0",
]

[tool.setuptools]
py-modules = ["mcp_server", "firestore_modules", "logger"]

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
