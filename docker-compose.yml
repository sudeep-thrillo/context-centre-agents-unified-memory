services:
  context_centre_mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: context_centre_mcp:latest
    restart: unless-stopped
    environment:
      - GCS_SERVICE_ACCOUNT_PATH=/run/secrets/google-credentials.json
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/google-credentials.json
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    ports:
      - 8000:8000
    volumes:
      - ${GCS_SERVICE_ACCOUNT_PATH}:/run/secrets/google-credentials.json:ro
    command: python3 mcp_server.py
